# cerp configuration (MPC001-115). Copy to cerp.local.yaml (git-ignored) and adjust.
# Any value can be overridden by an environment variable: CERP__HTTP__PORT=8000, CERP__DATA__DBROOT=...
# Relative paths are relative to this file.

server:
  name: cerp
  protocol_versions: ["2025-06-18", "2025-11-25", "2026-07-28"]   # MPC001-013
  instructions: >-
    cerp gives access to a small business's webos ERP data. Records are identified by handles of the form
    <module>:<model>:<id>. Use the describe tools to learn a model's fields before querying it.
  reload_poll_seconds: 5   # reload limits/exposure/kill_switches when this file or the exposure file changes

http:
  host: 127.0.0.1        # loopback only until TLS lands (MPC001-034)
  port: 7411
  path: /mcp

auth:
  static_tokens:         # development only, loopback only (MPC001-059)
    enabled: false
    tokens:
      - token_env: CERP_DEV_TOKEN   # the token value lives in this environment variable, never in this file
        user: admin
  oauth:                 # OAuth 2.1 resource server (MPC001-057); enable this OR static_tokens
    enabled: false
    issuer: https://login.example.com/realms/acme
    audience: https://cerp.example.com/mcp     # this server's resource URI; default http://host:port/path
    jwks_url: https://login.example.com/realms/acme/protocol/openid-connect/certs
    algorithms: [RS256, ES256]                  # asymmetric only; none and HS* are always refused
    leeway_seconds: 60
    required_scopes: []
    # introspection:                            # for opaque tokens (RFC 7662)
    #   url: https://login.example.com/realms/acme/protocol/openid-connect/token/introspect
    #   client_id_env: CERP_INTROSPECTION_ID
    #   client_secret_env: CERP_INTROSPECTION_SECRET
  principals: []         # OAuth issuer + subject -> webos user (MPC001-060), e.g.
  #   - {issuer: "https://login.example.com/realms/acme", subject: "3f2a…", user: alice}
  # local_user: alice    # stdio only (`cerp stdio`): the webos user a local client acts as (MPC001-168)

tools:
  packs: []              # read-only decision-support tools: [pm, crm, personal] (MPC001-088)
  cursor_ttl_seconds: 900

kill_switches: {}        # e.g. {writes: true, "module:crm": true, "tool:im.create_ticket": true} (MPC001-116)

data:
  # MPC001-200: database paths come from the webos datasource file. Missing databases are created from
  # $(TEMPLATE) at startup (logged as WARNING); a datasource inside the template folder is refused.
  datasources_file: datasources.xml
  root: ..                         # application root for relative paths in datasources.xml
  bootstrap_from_templates: true
  # dbroot: ../var/db              # optional: overrides $(DBROOT), e.g. for a test tenant
  busy_timeout_ms: 5000

registry:
  path: ../var/registry/webos.yaml    # generated by `cerp registry generate` (MPC002-006)

exposure:
  path: exposure.example.yaml          # MPC001-080

limits:
  max_page_size: 100

logging:
  level: INFO
  file: ../var/log/cerp.log
  audit_file: ../var/log/audit.jsonl   # one JSON line per tools/call (MPC001-110)
